<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Atendimento virtual da Empório da Música. Consulte instrumentos e políticas autorizadas da loja."
    />
    <meta name="theme-color" content="#171918" />
    <script>
      (() => {
        let tema;
        try {
          tema = localStorage.getItem('emporio-tema');
        } catch {}
        if (tema !== 'claro' && tema !== 'escuro') {
          tema = matchMedia('(prefers-color-scheme: dark)').matches
            ? 'escuro'
            : 'claro';
        }
        document.documentElement.dataset.tema = tema;
        document.documentElement.style.colorScheme =
          tema === 'escuro' ? 'dark' : 'light';
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/icon_emporio.svg" />
    <title>Empório da Música | Atendimento</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/principal.tsx"></script>
  </body>
</html>
